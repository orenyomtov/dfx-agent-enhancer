<!doctype html><html><head><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Geist+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>body{margin:0;width:1200px;height:630px;background:#000;color:#ededed;font-family:Geist;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 40% 60% at 78% 60%,rgba(40,110,255,.45),transparent 70%),radial-gradient(ellipse 30% 30% at 70% 95%,rgba(180,227,61,.18),transparent 70%)}
.lines{position:absolute;inset:0;background-image:linear-gradient(to bottom,rgba(255,255,255,.06) 1px,transparent 1px);background-size:100% 48px;-webkit-mask-image:radial-gradient(ellipse 50% 70% at 75% 55%,#000 10%,transparent 70%)}
.t{position:absolute;left:80px;top:170px;width:620px}
h1{font:400 104px/.92 'Instrument Serif';margin:0 0 28px}h1 em{color:#cfcfcf}
p{font-size:30px;line-height:1.3;margin:0 0 36px;letter-spacing:-.01em}p span{color:#a1a1a1}
code{font:20px 'Geist Mono';color:#a1a1a1;border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:12px 16px;background:#0a0a0a}
img{position:absolute;right:110px;top:50px;width:330px;filter:drop-shadow(0 30px 50px rgba(0,40,140,.6))}</style></head>
<body><div class="glow"></div><div class="lines"></div><div class="t"><h1>DFX Agent <em>Enhancer</em></h1><p>Your Claude Code and Cursor agents, live in the menu bar. <span>In the classic blue DFX skin.</span></p><code>macOS · menu-bar widget · offline</code></div><img src="panel.png"></body></html>
